<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>动态简历</title>
    <style>
      @font-face { font-family: 'Inter Tight'; font-weight: 400; src: url(fonts/inter-tight-latin-400-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Inter Tight'; font-weight: 500; src: url(fonts/inter-tight-latin-500-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Inter Tight'; font-weight: 600; src: url(fonts/inter-tight-latin-600-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Inter Tight'; font-weight: 700; src: url(fonts/inter-tight-latin-700-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Inter Tight'; font-weight: 800; src: url(fonts/inter-tight-latin-800-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Instrument Serif'; font-style: normal; src: url(fonts/instrument-serif-latin-400-normal.woff2) format('woff2'); }
      @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url(fonts/instrument-serif-latin-400-italic.woff2) format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2'); }
      @font-face { font-family: 'JetBrains Mono'; font-weight: 600; src: url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2'); }

      :root { --bg: #0e0e0d; --fg: #f4f1ea; --muted: #8d887d; --accent: #d97757; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 'JetBrains Mono', ui-monospace, monospace; }
      body { display: grid; grid-template-rows: 1fr auto; }
      .stage { display: grid; place-items: center; min-height: 0; padding: 16px; }
      canvas { width: min(100%, calc((100vh - 96px) * 16 / 9)); aspect-ratio: 16 / 9; height: auto; border-radius: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
      .bar { display: flex; gap: 14px; align-items: center; padding: 12px 16px 18px; }
      button { font: inherit; color: var(--fg); background: #1d1c1a; border: 1px solid #2d2c29; border-radius: 999px; padding: 8px 16px; cursor: pointer; }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      input[type=range] { flex: 1; accent-color: var(--accent); }
      #motion[aria-pressed=true] { border-color: var(--accent); }
      .tc { color: var(--muted); min-width: 150px; text-align: right; font-variant-numeric: tabular-nums; }
      body.render { display: block; background: #000; }
      body.render .stage { padding: 0; display: block; }
      body.render canvas { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; }
      body.render .bar { display: none; }
    </style>
  </head>
  <body>
    <div class="stage"><canvas id="c" width="1920" height="1080" data-i18n-aria="canvasAria" aria-label="动态简历动画"></canvas></div>
    <div class="bar">
      <button id="play" type="button" data-i18n-aria="playAria">播放</button>
      <input id="scrub" type="range" min="0" max="1799" value="0" step="1" data-i18n-aria="frameAria" />
      <button id="motion" type="button" hidden aria-pressed="false" data-i18n="fullMotion"></button>
      <button id="lang" type="button" data-i18n="switchTo" data-i18n-aria="switchAria"></button>
      <span class="tc" id="tc">00.000 s · F0000</span>
    </div>
    <!-- fresh checkout: score.wav is a build output, so fall back to the committed Opus copy (then the MP4's AAC track) -->
    <audio id="audio" preload="auto">
      <source src="out/score.wav" type="audio/wav" />
      <source src="out/score.webm" type="audio/webm; codecs=opus" />
      <source src="out/claude-motion-resume.mp4" type="video/mp4" />
    </audio>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
